name: Publish portfolio

# Three ways in:
#   · repository_dispatch — the admin panel, after staging photos in _inbox/
#   · workflow_dispatch   — the "Run workflow" button, for testing
#   · push to main        — a hand edit (copy, CSS) deploys too
on:
  repository_dispatch:
    types: [portfolio-publish]
  workflow_dispatch:
  push:
    branches: [main]
    # The admin panel's staging commit fires repository_dispatch itself, so
    # ignoring _inbox/ here stops the same batch from running twice.
    paths-ignore:
      - "_inbox/**"
      - "**/*.md"

# GITHUB_TOKEN scopes. Note the absence of `secrets.*` anywhere in this file:
# GitHub mints this token per run and destroys it when the job ends, so there
# is no long-lived credential to store, rotate or leak.
permissions:
  contents: write # commit processed images + JSON
  pages: write # deploy
  id-token: write # OIDC, required by deploy-pages

# Two uploads in quick succession would otherwise race on the same JSON files
# and one would silently lose its photos. Serialise them.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The default GITHUB_TOKEN is persisted, which is what lets the commit
        # step below push without any extra credential.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - run: npm ci
        working-directory: tools

      - name: Process staged uploads
        run: node tools/process-inbox.mjs

      # Finishes the other half of a deletion. Removing a photo from the panel
      # rewrites one category file and nothing else, so the 12 image variants
      # are still on disk and data/index.json still advertises the old cover
      # and count — index.json is derived, and process-inbox.mjs returns early
      # when _inbox/ is empty, so a delete-only change never reaches its
      # rebuild. This collects the orphans and rebuilds regardless.
      - name: Prune deleted photos and rebuild the index
        run: node tools/prune.mjs

      # Category pages are real directories because Pages cannot rewrite URLs,
      # so they must be regenerated whenever a category is added, renamed,
      # reordered or unpublished.
      - name: Regenerate category pages
        run: node tools/build-pages.mjs

      # Generated from the same index.json, so a category added or unpublished
      # through /admin/ can never leave the sitemap advertising a dead URL.
      - name: Regenerate sitemap
        run: node tools/build-sitemap.mjs

      # The share card is built from the current cover photo, so it must be
      # rebuilt here too — otherwise the first real shoot replaces the
      # placeholder everywhere on the site EXCEPT the image that people
      # actually see when the link is shared.
      - name: Regenerate social share card
        run: node tools/build-og.mjs

      # This push does NOT re-trigger this workflow, even though it changes
      # images/ and data/ on main. GitHub deliberately suppresses workflow
      # triggers for pushes made with GITHUB_TOKEN — which is the whole reason
      # branch-based Pages needed a stored PAT, and the reason we don't.
      - name: Commit processed assets
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add -A
          # `git commit` exits non-zero with nothing staged, which would fail a
          # plain push-only deploy. Nothing to commit is a normal outcome here.
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish: ${{ github.event.client_payload.message || 'portfolio update' }}"
            git push
          fi

      # Build the artifact from a copy, so build-time-only files never reach
      # the public site. tools/node_modules alone is tens of megabytes.
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude '_inbox' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            --exclude '*.md'
          # Without .nojekyll, Jekyll strips every path beginning with an
          # underscore and rewrites what it feels like.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
